# Iris global config — shipped by the pack so the default shader is enabled on first launch.
# shaderPack points at the directory EuphoriaPatcher generates during mod construction
# (before any world render), from the locked ComplementaryReimagined_r5.9.3.zip resource
# in manifest/locked-mods.json. If the pair is ever bumped, update this name to match
# PatchInfo.VERSION/PATCH_VERSION of the locked EuphoriaPatcher jar.
# Players can disable shaders or pick another profile in Video Settings.
enableShaders=true
shaderPack=ComplementaryReimagined_r5.9.3 + EuphoriaPatches_1.10.5
