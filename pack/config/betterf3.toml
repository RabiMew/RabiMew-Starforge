  display = false
  opengl_version = false
  time = false

[[modules_right]]
name = "server"
enabled = true
  [modules_right.lines]
  server_tick = true
  tick_manager_status = false
  packets_sent = false
  packets_received = false

[[modules_right]]
name = "target"
enabled = true
  [modules_right.lines]
  targeted_block = true
  id_block = true
  targeted_entity = true
  targeted_fluid = false
  id_fluid = false
  fluid_states = false
  fluid_tags = false
  block_states = false
  block_tags = false
