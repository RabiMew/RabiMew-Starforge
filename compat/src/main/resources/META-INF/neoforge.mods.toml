license="MIT"
issueTrackerURL="https://github.com/RabiMew/RabiMew-Starforge/issues"

[[mods]]
    modId="starforge_compat"
    version="0.1.0"
    displayName="Starforge Compatibility"
    authors="RabiMew"
    description="Behavior-level glue for Starforge: FE-powered kitchen heat source, horde redstone alarms, registered-supply-point caching for TACZ guards, turret/horde CPU staggering and a hidden first-PvP-kill keepsake. Content-level integration stays in KubeJS/datapacks."

# Stage-string i18n mixins (see com.starforge.compat.mixin + StageI18n):
# ProgressiveStages renders bilingual "zh / en" literals; the mixins swap in
# the client locale's half via config/starforge/stage_i18n.json lang keys.
[[mixins]]
config="starforge_compat.mixins.json"

